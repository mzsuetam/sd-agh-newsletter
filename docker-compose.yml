services:
  web:
    build: .
    image: sd-agh-edu-pl-mailer:latest
    command:
      - uvicorn
      - app.web:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --proxy-headers
    env_file: .env
    environment:
      DB_PATH: /data/app.db
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3

  scheduler:
    build: .
    image: sd-agh-edu-pl-mailer:latest
    command:
      - python
      - -m
      - app.watcher
    env_file: .env
    environment:
      DB_PATH: /data/app.db
    volumes:
      - app-data:/data
    restart: unless-stopped
    depends_on:
      - web

volumes:
  app-data:
